name: Desktop Build (Linux & Windows)

on:
  push:
    branches: [ "master", "experimental", "kmp-migration" ]
  pull_request:
    branches: [ "master", "experimental", "kmp-migration" ]

jobs:
  build-desktop:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Build Desktop Installers (Deb & Msi)
      run: ./gradlew packageDistributionForCurrentOS

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: gabi-desktop-${{ runner.os }}
        path: app/build/compose/binaries/main/app/*
